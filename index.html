<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSCAR HACKER TOOL v4.0 - Live</title>
<style>
:root{--bg:#0a0e13;--card:#111820;--neon:#00ff88;--warn:#ffaa00;--bad:#ff3344;--text:#e0f0e0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:1px solid #1f2a36;border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:0 0 40px rgba(0,255,136,.08)}
h1{font-size:1.4rem;letter-spacing:2px;color:var(--neon);text-align:center;margin-bottom:6px}
.sub{font-size:.75rem;opacity:.6;text-align:center;margin-bottom:20px}
.input-wrap{position:relative}
input{width:100%;background:#0d131c;border:1px solid #1f2a36;border-radius:10px;padding:14px 44px 14px 14px;color:var(--text);font-size:1rem;outline:none;transition:.2s}
input:focus{border-color:var(--neon)}
#toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--neon);cursor:pointer;font-size:1.2rem}
.meter{height:8px;background:#1a2332;border-radius:99px;margin:14px 0;overflow:hidden}
.meter-fill{height:100%;width:0%;transition:width .4s ease, background .4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:#0d131c;border-radius:8px;padding:10px;font-size:.8rem}
.stat b{display:block;font-size:1.1rem;color:var(--neon);margin-top:2px}
.criteria{margin-top:12px;display:grid;gap:6px}
.crit{display:flex;justify-content:space-between;font-size:.8rem;padding:6px 8px;border-radius:6px;background:#0d131c;opacity:.5;transition:.2s}
.crit.ok{opacity:1;background:rgba(0,255,136,.08);color:var(--neon)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.live-dot.active{background:var(--neon)}
</style>
</head>
<body>
<div class="card">
<h1>OSCAR TOOL v4.0</h1>
<p class="sub"><span id="dot" class="live-dot"></span> <span id="statusTxt">Live check - type to analyze</span></p>

<div class="input-wrap">
<input id="pwd" type="password" placeholder="Type password..." autocomplete="off" autofocus>
<button id="toggle">👁️</button>
</div>

<div class="meter"><div id="meter" class="meter-fill"></div></div>

<div class="stats">
<div class="stat">Score <b id="score">0 / 100</b></div>
<div class="stat">Crack Time <b id="crack">-</b></div>
<div class="stat">Entropy <b id="entropy">0 bits</b></div>
<div class="stat">Length <b id="len">0</b></div>
</div>

<div id="criteria" class="criteria"></div>
</div>

<script>
// ===== CONFIG =====
const DEBOUNCE_MS = 800; // change to 3000 if you want 3 seconds

// ===== REUSABLE UTILS =====
const debounce = (fn, delay) => {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
};

const checkCriteria = (pwd) => ({
  length: pwd.length >= 8,
  upper: /[A-Z]/.test(pwd),
  lower: /[a-z]/.test(pwd),
  number: /\d/.test(pwd),
  special: /[^A-Za-z0-9]/.test(pwd),
  long: pwd.length >= 12
});

const calcScore = (pwd, c) => {
  if(!pwd) return 0;
  let s = 0;
  s += Math.min(pwd.length * 4, 40);
  if(c.upper) s+=10; if(c.lower) s+=10; if(c.number) s+=15; if(c.special) s+=20;
  if(c.length && c.upper && c.lower && c.number && c.special) s+=5;
  return Math.min(s, 100);
};

const calcEntropy = (pwd) => {
  let pool = 0;
  if(/[a-z]/.test(pwd)) pool+=26;
  if(/[A-Z]/.test(pwd)) pool+=26;
  if(/\d/.test(pwd)) pool+=10;
  if(/[^A-Za-z0-9]/.test(pwd)) pool+=32;
  return pool ? Math.round(pwd.length * Math.log2(pool)) : 0;
};

const estimateCrackTime = (entropy) => {
  const guesses = Math.pow(2, entropy);
  const perSec = 1e10; // 10B guesses/sec (offline)
  const sec = guesses / perSec;
  if(sec < 1) return "Instant";
  if(sec < 60) return `${Math.round(sec)}s`;
  if(sec < 3600) return `${Math.round(sec/60)}m`;
  if(sec < 86400) return `${Math.round(sec/3600)}h`;
  if(sec < 31536000) return `${Math.round(sec/86400)}d`;
  if(sec < 315360000) return `${Math.round(sec/31536000)}y`;
  return "Centuries";
};

const getColor = (score) => {
  if(score < 30) return "var(--bad)";
  if(score < 60) return "var(--warn)";
  return "var(--neon)";
};

// ===== UI ONLY =====
const el = {
  pwd: document.getElementById('pwd'),
  meter: document.getElementById('meter'),
  score: document.getElementById('score'),
  crack: document.getElementById('crack'),
  entropy: document.getElementById('entropy'),
  len: document.getElementById('len'),
  criteria: document.getElementById('criteria'),
  dot: document.getElementById('dot'),
  status: document.getElementById('statusTxt')
};

function updateUI(pwd){
  const c = checkCriteria(pwd);
  const score = calcScore(pwd, c);
  const entropy = calcEntropy(pwd);
  
  // single DOM batch update
  el.meter.style.width = score + "%";
  el.meter.style.background = getColor(score);
  el.score.textContent = score + " / 100";
  el.entropy.textContent = entropy + " bits";
  el.len.textContent = pwd.length;
  el.crack.textContent = pwd ? estimateCrackTime(entropy) : "-";
  
  el.criteria.innerHTML = Object.entries({
    "8+ characters": c.length,
    "Uppercase A-Z": c.upper,
    "Lowercase a-z": c.lower,
    "Number 0-9": c.number,
    "Special !@#": c.special
  }).map(([k,v]) => `<div class="crit ${v?'ok':''}"><span>${k}</span><span>${v?'✓':'×'}</span></div>`).join('');

  el.dot.classList.toggle('active', pwd.length>0);
  el.status.textContent = pwd ? `Analyzed live (${score}%)` : "Live check - type to analyze";
}

// ===== LIVE BINDING =====
const liveCheck = debounce((e) => updateUI(e.target.value), DEBOUNCE_MS);
el.pwd.addEventListener('input', liveCheck);

// show instantly on first keystroke, then debounce next
el.pwd.addEventListener('input', (e) => {
  if(e.target.value.length === 1) updateUI(e.target.value);
});

document.getElementById('toggle').onclick = () => {
  el.pwd.type = el.pwd.type === 'password' ? 'text' : 'password';
};

updateUI("");
</script>
</body>
</html>
