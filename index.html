<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OSCAR HACKER TOOL v4.0 Live</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="card"><h1>OSCAR TOOL v4.0</h1><p class="sub"><span id="dot" class="live-dot"></span><span id="statusTxt">Live - type to analyze</span></p>
<div class="input-wrap"><input id="pwd" type="password" placeholder="Type password..." autocomplete="off" autofocus><button id="toggle">👁️</button></div>
<div class="meter"><div id="meter" class="meter-fill"></div></div>
<div class="stats"><div class="stat">Score <b id="score">0 / 100</b></div><div class="stat">Crack Time <b id="crack">-</b></div><div class="stat">Entropy <b id="entropy">0 bits</b></div><div class="stat">Length <b id="len">0</b></div></div>
<div id="criteria" class="criteria"></div><footer>Built by Oscar Kelvin • PH • 2026</footer></div>
<script src="script.js"></script>
</body>
</html>
